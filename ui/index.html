<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>OKX 交易 Agent</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c2129;--border:#2d333b;--text:#e6edf3;
    --dim:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{font-size:15px;font-weight:600}
  .badge{padding:3px 10px;border-radius:11px;font-size:12px;font-weight:600}
  .run{background:rgba(63,185,80,.16);color:var(--green);border:1px solid rgba(63,185,80,.4)}
  .stop{background:rgba(139,148,158,.14);color:var(--dim);border:1px solid var(--border)}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:5px 12px;
    border-radius:6px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--blue);color:var(--blue)}
  button.primary{background:rgba(88,166,255,.14);border-color:rgba(88,166,255,.45);color:var(--blue)}
  button.danger{color:var(--red);border-color:rgba(248,81,73,.4)}
  button.sm{padding:3px 9px;font-size:11px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .tabs{display:flex;gap:2px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tab{padding:9px 15px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;font-size:13px}
  .tab.active{color:var(--text);border-bottom-color:var(--blue)}
  main{padding:15px 18px;height:calc(100vh - 98px);overflow:auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 13px}
  .card .k{color:var(--dim);font-size:11px}
  .card .v{font-size:18px;font-weight:600;margin-top:2px}
  .up{color:var(--green)}.down{color:var(--red)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:13px}
  .panel h2{font-size:13px;padding:9px 14px;border-bottom:1px solid var(--border);color:var(--dim);font-weight:600;
    display:flex;align-items:center;gap:10px}
  .panel h2 .spacer{flex:1}
  .panel .body{padding:11px 14px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:11px}
  tr:hover td{background:rgba(255,255,255,.02)}
  #log{background:#0a0d12;border:1px solid var(--border);border-radius:6px;padding:9px;height:320px;
    overflow:auto;font:11px/1.6 Consolas,monospace;white-space:pre-wrap;color:#b9c3ce}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  label{width:88px;color:var(--dim);font-size:12px;flex-shrink:0}
  input,select,textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:5px 9px;border-radius:5px;font-size:12px;flex:1;min-width:130px}
  textarea{min-height:150px;font:11px/1.6 Consolas,monospace;resize:vertical;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
  .hint{color:var(--dim);font-size:11px}
  .alert{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.35);color:var(--yellow);
    padding:8px 12px;border-radius:6px;margin-bottom:11px;font-size:12px}
  .empty{color:var(--dim);padding:14px;text-align:center;font-size:12px}
  .tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;margin-right:3px}
  .t-buy{background:rgba(63,185,80,.15);color:var(--green)}
  .t-sell{background:rgba(248,81,73,.15);color:var(--red)}
  .t-hold{background:rgba(139,148,158,.15);color:var(--dim)}
  .t-on{background:rgba(63,185,80,.15);color:var(--green)}
  .t-off{background:rgba(139,148,158,.12);color:var(--dim)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:99}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:660px;
    max-width:92vw;max-height:86vh;overflow:auto}
  .modal h3{font-size:14px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .modal .body{padding:14px 16px}
  .modal .foot{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
  .chk{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .chk input{width:auto;flex:none;min-width:auto}
  .chk label{width:auto}
</style>
</head>
<body>
<header>
  <h1>OKX 交易 Agent</h1>
  <span id="status" class="badge stop">未运行</span>
  <span id="modelTag" class="hint"></span>
  <span class="spacer"></span>
  <button id="btnOnce">跑一轮</button>
  <button id="btnStart" class="primary">启动服务</button>
  <button id="btnStop" class="danger" disabled>停止</button>
</header>

<div class="tabs">
  <div class="tab active" data-t="dash">总览</div>
  <div class="tab" data-t="models">模型</div>
  <div class="tab" data-t="roles">角色</div>
  <div class="tab" data-t="mcp">MCP</div>
  <div class="tab" data-t="skills">Skill</div>
  <div class="tab" data-t="log">日志</div>
  <div class="tab" data-t="cfg">设置</div>
</div>

<main>
<!-- 总览 -->
<div id="dash">
  <div id="alerts"></div>
  <div class="cards" id="cards"></div>
  <div class="panel"><h2>持仓</h2><div class="body"><div id="positions"></div></div></div>
  <div class="panel"><h2>最近决策</h2><div class="body"><div id="decision"></div></div></div>
  <div class="panel"><h2>专家观点</h2><div class="body"><div id="experts"></div></div></div>
</div>

<!-- 模型 -->
<div id="models" style="display:none">
  <div class="panel">
    <h2>模型配置<span class="spacer"></span><button class="primary sm" id="btnAddModel">+ 新增模型</button></h2>
    <div class="body"><div id="modelList"></div>
      <div class="hint" style="margin-top:9px">支持任意 OpenAI 兼容接口（DeepSeek/OpenAI/通义/Kimi/本地 vLLM/Ollama 中转等）与 Anthropic 原生。</div>
    </div>
  </div>
</div>

<!-- 角色 -->
<div id="roles" style="display:none">
  <div class="panel">
    <h2>角色（专家）<span class="spacer"></span><button class="primary sm" id="btnAddRole">+ 新增角色</button></h2>
    <div class="body"><div id="roleList"></div>
      <div class="hint" style="margin-top:9px">每个角色可单独指定模型、Skill 与 MCP 权限。改完下一轮生效。</div>
    </div>
  </div>
</div>

<!-- MCP -->
<div id="mcp" style="display:none">
  <div class="panel">
    <h2>MCP Server<span class="spacer"></span><button class="primary sm" id="btnAddMcp">+ 新增</button></h2>
    <div class="body"><div id="mcpList"></div></div>
  </div>
</div>

<!-- Skill -->
<div id="skills" style="display:none">
  <div class="panel"><h2>技能</h2><div class="body"><div id="skillList"></div></div></div>
</div>

<!-- 日志 -->
<div id="logview" style="display:none">
  <div class="row"><button id="btnClear">清空</button><span class="hint">agent 服务实时输出</span></div>
  <div id="log"></div>
</div>

<!-- 设置 -->
<div id="cfgview" style="display:none">
  <div class="panel"><h2>运行参数</h2><div class="body">
    <div class="row"><label>默认模型</label><select id="cDefaultModel"></select></div>
    <div class="row"><label>主Agent模型</label><select id="cMainModel"></select></div>
    <div class="row"><label>轮次间隔</label><input id="cInterval" type="number" min="1" max="120" /><span class="hint">分钟</span></div>
    <div class="row"><label>角色策略</label>
      <select id="cRoleStrategy">
        <option value="llm">主Agent自决（推荐）</option>
        <option value="fixed">固定角色</option>
      </select>
    </div>
    <div class="row" id="rowFixedRoles"><label>固定角色</label><div class="chk" id="cFixedRoles"></div></div>
    <div class="row"><label></label><div class="chk">
      <input type="checkbox" id="cAuto" /><label for="cAuto">启动自动运行服务</label>
      <input type="checkbox" id="cDry" /><label for="cDry">演练模式（不下真实单）</label>
    </div></div>
  </div></div>
  <div class="row">
    <button id="btnSave" class="primary">保存</button>
    <button id="btnOpenStore">打开数据文件</button>
    <button id="btnOpenState">state 目录</button>
    <button id="btnOpenLogs">日志目录</button>
    <button id="btnReset" class="danger">恢复默认</button>
  </div>
  <div class="hint" style="margin-top:8px">所有配置保存在 agent/data/store.json（本机，不上传）。</div>
</div>
</main>

<!-- 编辑弹窗 -->
<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle">编辑</h3>
  <div class="body" id="mBody"></div>
  <div class="foot">
    <button id="mCancel">取消</button>
    <button id="mSave" class="primary">保存</button>
  </div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const api = window.api;
const esc = s => String(s??'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = (n,d=2) => (n==null||isNaN(n))?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const cls = n => n>0?'up':n<0?'down':'';
const uid = p => p + '_' + Math.random().toString(36).slice(2,9);

let models=[], roles=[], mcps=[], skills=[], settings=null;

// 页签
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['dash','models','roles','mcp','skills','logview','cfgview'].forEach(k=>{
      $('#'+k).style.display = k===t.dataset.t ? '' : 'none';
    });
  };
});

// ── 总览 ──
async function refresh(){
  const s = await api.getStatus();
  const rt = s.runtime||{}, rd = s.latestRound||{};
  $('#status').textContent = s.agentRunning?'运行中':'未运行';
  $('#status').className = 'badge '+(s.agentRunning?'run':'stop');
  $('#btnStart').disabled = s.agentRunning;
  $('#btnStop').disabled = !s.agentRunning;

  let al='';
  if(s.pending?.length) al+=`<div class="alert">⏸ ${s.pending.length} 笔待人工确认：${s.pending.join('、')}</div>`;
  const cur = models.find(m=>m.id===settings?.defaultModelId);
  if(cur?.provider==='mock') al+=`<div class="alert">当前默认模型为 mock，不会真实调用。到「模型」页添加 API Key 并设为默认。</div>`;
  $('#alerts').innerHTML=al;
  $('#modelTag').textContent = cur ? `模型：${cur.name}` : '';

  const pos = rd.positions||[];
  const upl = pos.reduce((a,p)=>a+(Number(p.upl)||0),0);
  $('#cards').innerHTML=`
    <div class="card"><div class="k">权益</div><div class="v">${fmt(rd.equity_usdt)}</div></div>
    <div class="card"><div class="k">可用</div><div class="v">${fmt(rd.available_usdt)}</div></div>
    <div class="card"><div class="k">浮盈</div><div class="v ${cls(upl)}">${upl>=0?'+':''}${fmt(upl)}</div></div>
    <div class="card"><div class="k">持仓数</div><div class="v">${pos.length}</div></div>
    <div class="card"><div class="k">最近轮次</div><div class="v">${rd.round_id||rt.last_round_id||'—'}</div></div>
    <div class="card"><div class="k">本日止损</div><div class="v">${rt.day_sl_count||0}</div></div>`;

  $('#positions').innerHTML = pos.length?`<table><tr><th>标的</th><th>方向</th><th>张数</th><th>开仓</th><th>标记</th><th>杠杆</th><th>浮盈</th></tr>
    ${pos.map(p=>`<tr><td>${p.instrument}</td>
    <td><span class="tag ${p.side==='long'?'t-buy':'t-sell'}">${p.side==='long'?'多':'空'}</span></td>
    <td>${p.size_contracts}</td><td>${fmt(p.entry)}</td><td>${fmt(p.mark)}</td><td>${p.leverage}x</td>
    <td class="${cls(p.upl)}">${p.upl>=0?'+':''}${fmt(p.upl)}</td></tr>`).join('')}</table>`:'<div class="empty">暂无持仓</div>';

  $('#decision').innerHTML = rd.decision?`<div style="white-space:pre-wrap;font-size:12px;line-height:1.75">${esc(rd.decision)}</div>`:'<div class="empty">暂无决策</div>';

  const ex = rd.experts||[];
  const st = {bullish:'看多',bearish:'看空',neutral:'中性',abstain:'弃权'};
  $('#experts').innerHTML = ex.length?`<table><tr><th>角色</th><th>立场</th><th>结论</th></tr>
    ${ex.map(e=>`<tr><td>${esc(e.expert)}</td>
    <td><span class="tag ${e.stance==='bullish'?'t-buy':e.stance==='bearish'?'t-sell':'t-hold'}">${st[e.stance]||e.stance}</span></td>
    <td>${esc((e.summary||'').slice(0,220))}</td></tr>`).join('')}</table>`:'<div class="empty">暂无（需真实模型）</div>';
}

// ── 模型 ──
function renderModels(){
  $('#modelList').innerHTML = models.length?`<table><tr><th>名称</th><th>类型</th><th>模型</th><th>Base URL</th><th>状态</th><th>操作</th></tr>
    ${models.map(m=>`<tr><td>${esc(m.name)}${m.id===settings?.defaultModelId?' <span class="tag t-on">默认</span>':''}${m.id===settings?.mainAgentModelId?' <span class="tag t-on">主Agent</span>':''}</td>
    <td>${m.provider}</td><td>${esc(m.model)}</td><td style="max-width:200px;word-break:break-all">${esc(m.baseURL||'—')}</td>
    <td><span class="tag ${m.enabled?'t-on':'t-off'}">${m.enabled?'启用':'停用'}</span></td>
    <td><button class="sm" onclick="editModel('${m.id}')">编辑</button>
    <button class="sm" onclick="testModel('${m.id}')">测试</button>
    <button class="sm danger" onclick="delModel('${m.id}')">删</button></td></tr>`).join('')}</table>`:'<div class="empty">暂无模型</div>';
}

window.editModel = id => {
  const m = models.find(x=>x.id===id) || {id:uid('model'),name:'',provider:'openai-compatible',
    baseURL:'https://api.deepseek.com',apiKey:'',model:'deepseek-chat',enabled:true,note:''};
  openModal(m.id&&models.find(x=>x.id===id)?'编辑模型':'新增模型', `
    <div class="row"><label>名称</label><input id="f_name" value="${esc(m.name)}" placeholder="如：DeepSeek 主力"></div>
    <div class="row"><label>类型</label><select id="f_provider">
      <option value="openai-compatible"${m.provider==='openai-compatible'?' selected':''}>OpenAI 兼容（推荐）</option>
      <option value="anthropic"${m.provider==='anthropic'?' selected':''}>Anthropic 原生</option>
      <option value="mock"${m.provider==='mock'?' selected':''}>mock（联调）</option></select></div>
    <div class="row"><label>Base URL</label><input id="f_baseURL" value="${esc(m.baseURL)}" placeholder="https://api.deepseek.com"></div>
    <div class="row"><label>模型名</label><input id="f_model" value="${esc(m.model)}" placeholder="deepseek-chat"></div>
    <div class="row"><label>API Key</label><input id="f_apiKey" type="password" value="${esc(m.apiKey)}" placeholder="sk-..."></div>
    <div class="row"><label>温度</label><input id="f_temp" type="number" step="0.1" value="${m.temperature??0.2}"></div>
    <div class="row"><label>备注</label><input id="f_note" value="${esc(m.note||'')}"></div>
    <div class="row"><label></label><div class="chk"><input type="checkbox" id="f_enabled" ${m.enabled!==false?'checked':''}><label for="f_enabled">启用</label></div></div>
  `, async ()=>{
    await api.modelsUpsert({id:m.id,name:$('#f_name').value,provider:$('#f_provider').value,
      baseURL:$('#f_baseURL').value,apiKey:$('#f_apiKey').value,model:$('#f_model').value,
      temperature:Number($('#f_temp').value),note:$('#f_note').value,enabled:$('#f_enabled').checked,
      createdAt:m.createdAt||new Date().toISOString()});
    await loadAll();
  });
};
window.testModel = async id => {
  const m = models.find(x=>x.id===id);
  const r = await api.modelsTest(m);
  alert(r.ok?`✅ 连接成功（${r.latencyMs}ms）\n${r.reply||''}`:`❌ 失败\n${r.error}`);
};
window.delModel = async id => { if(confirm('确定删除该模型？')){ await api.modelsDelete(id); await loadAll(); } };

// ── 角色 ──
function renderRoles(){
  $('#roleList').innerHTML = roles.length?`<table><tr><th>名称</th><th>ID</th><th>模型</th><th>Skill</th><th>MCP</th><th>状态</th><th>操作</th></tr>
    ${roles.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.id)}</td>
    <td>${esc((models.find(m=>m.id===r.modelId)?.name)||'默认')}</td>
    <td style="max-width:150px">${(r.skills||[]).join(', ')||'—'}</td>
    <td style="max-width:120px">${(r.mcpServers||[]).join(', ')||'—'}</td>
    <td><span class="tag ${r.enabled?'t-on':'t-off'}">${r.enabled?'启用':'停用'}</span></td>
    <td><button class="sm" onclick="editRole('${r.id}')">编辑</button>
    <button class="sm danger" onclick="delRole('${r.id}')">删</button></td></tr>`).join('')}</table>`:'<div class="empty">暂无角色</div>';
}
window.editRole = id => {
  const r = roles.find(x=>x.id===id) || {id:uid('role'),name:'',duty:'',systemPrompt:'',skills:[],mcpServers:[],enabled:true};
  const modelOpts = ['<option value="">（用默认模型）</option>'].concat(
    models.map(m=>`<option value="${m.id}"${r.modelId===m.id?' selected':''}>${esc(m.name)}</option>`)).join('');
  const skillChk = skills.map(s=>`<input type="checkbox" id="rs_${s.id}" value="${s.id}"${(r.skills||[]).includes(s.id)?' checked':''}><label for="rs_${s.id}">${s.id}</label>`).join('');
  const mcpChk = mcps.map(m=>`<input type="checkbox" id="rm_${m.id}" value="${m.id}"${(r.mcpServers||[]).includes(m.id)?' checked':''}><label for="rm_${m.id}">${esc(m.name)}</label>`).join('');
  openModal(id&&roles.find(x=>x.id===id)?'编辑角色':'新增角色', `
    <div class="row"><label>名称</label><input id="f_name" value="${esc(r.name)}"></div>
    <div class="row"><label>ID</label><input id="f_id" value="${esc(r.id)}" ${id?'readonly':''}></div>
    <div class="row"><label>职责</label><input id="f_duty" value="${esc(r.duty)}"></div>
    <div class="row"><label>专用模型</label><select id="f_modelId">${modelOpts}</select></div>
    <div class="row"><label>Skill</label><div class="chk">${skillChk||'<span class="hint">无</span>'}</div></div>
    <div class="row"><label>MCP</label><div class="chk">${mcpChk||'<span class="hint">无</span>'}</div></div>
    <div class="row"><label>System Prompt</label></div>
    <textarea id="f_prompt">${esc(r.systemPrompt)}</textarea>
    <div class="row"><label></label><div class="chk"><input type="checkbox" id="f_enabled" ${r.enabled!==false?'checked':''}><label for="f_enabled">启用</label></div></div>
  `, async ()=>{
    await api.rolesUpsert({id:$('#f_id').value||r.id,name:$('#f_name').value,duty:$('#f_duty').value,
      systemPrompt:$('#f_prompt').value,modelId:$('#f_modelId').value||undefined,
      skills:[...document.querySelectorAll('[id^=rs_] input:checked')].map(i=>i.value),
      mcpServers:[...document.querySelectorAll('[id^=rm_] input:checked')].map(i=>i.value),
      enabled:$('#f_enabled').checked,createdAt:r.createdAt||new Date().toISOString()});
    await loadAll();
  });
};
window.delRole = async id => { if(confirm('确定删除该角色？')){ await api.rolesDelete(id); await loadAll(); } };

// ── MCP ──
function renderMcp(){
  $('#mcpList').innerHTML = mcps.length?`<table><tr><th>名称</th><th>类型</th><th>命令/URL</th><th>状态</th><th>操作</th></tr>
    ${mcps.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.url?'HTTP':'stdio'}</td>
    <td style="max-width:280px;word-break:break-all">${esc(m.url||((m.command||'')+' '+(m.args||[]).join(' ')))}</td>
    <td><span class="tag ${m.enabled?'t-on':'t-off'}">${m.enabled?'启用':'停用'}</span></td>
    <td><button class="sm" onclick="testMcp('${m.id}')">测试</button>
    <button class="sm" onclick="editMcp('${m.id}')">编辑</button>
    <button class="sm danger" onclick="delMcp('${m.id}')">删</button></td></tr>`).join('')}</table>`:'<div class="empty">暂无 MCP</div>';
}
window.editMcp = id => {
  const m = mcps.find(x=>x.id===id) || {id:uid('mcp'),name:'',command:'',args:[],enabled:true};
  openModal(id&&mcps.find(x=>x.id===id)?'编辑 MCP':'新增 MCP', `
    <div class="row"><label>名称</label><input id="f_name" value="${esc(m.name)}"></div>
    <div class="row"><label>ID</label><input id="f_id" value="${esc(m.id)}" ${id?'readonly':''}></div>
    <div class="row"><label>命令</label><input id="f_cmd" value="${esc(m.command||'')}" placeholder="okx-trade-mcp"></div>
    <div class="row"><label>参数</label><input id="f_args" value="${(m.args||[]).join(' ')}" placeholder="--modules all"></div>
    <div class="row"><label>URL(可选)</label><input id="f_url" value="${esc(m.url||'')}" placeholder="HTTP 型填此项，留空为 stdio"></div>
    <div class="row"><label>Headers</label><input id="f_headers" value="${esc(m.headers?JSON.stringify(m.headers):'')}" placeholder='{"Authorization":"Bearer xxx"}'></div>
    <div class="row"><label></label><div class="chk"><input type="checkbox" id="f_enabled" ${m.enabled!==false?'checked':''}><label for="f_enabled">启用</label></div></div>
    <div class="hint">Windows 下 npm 全局命令（.ps1/.cmd 垫片）会自动用 cmd /c 包装。</div>
  `, async ()=>{
    let headers=undefined;
    try{ const h=$('#f_headers').value.trim(); if(h) headers=JSON.parse(h); }catch(e){ alert('Headers 不是合法 JSON'); return; }
    await api.mcpUpsert({id:$('#f_id').value||m.id,name:$('#f_name').value,command:$('#f_cmd').value,
      args:$('#f_args').value.split(/\s+/).filter(Boolean),url:$('#f_url').value||undefined,
      headers,enabled:$('#f_enabled').checked,createdAt:m.createdAt||new Date().toISOString()});
    await loadAll();
  });
};
window.testMcp = async id => {
  const r = await api.mcpTest(id);
  alert(r.ok?`✅ 连接成功，${r.tools} 个工具`:`❌ 失败\n${(r.errors||[]).join('\n')||r.error}`);
};
window.delMcp = async id => { if(confirm('确定删除？')){ await api.mcpDelete(id); await loadAll(); } };

// ── Skill ──
function renderSkills(){
  $('#skillList').innerHTML = skills.length?`<table><tr><th>名称</th><th>参数</th><th>说明</th><th>权限</th><th>状态</th></tr>
    ${skills.map(s=>`<tr><td>${esc(s.name)}<br><span class="hint">${s.id}</span></td>
    <td style="max-width:200px"><span class="hint">${esc(s.args)}</span></td>
    <td style="max-width:280px">${esc(s.description)}</td>
    <td><span class="tag ${s.readOnly?'t-on':'t-off'}">${s.readOnly?'只读':'写'}</span></td>
    <td><input type="checkbox" ${s.enabled?'checked':''} onchange="toggleSkill('${s.id}',this.checked)"></td></tr>`).join('')}</table>`:'<div class="empty">暂无</div>';
}
window.toggleSkill = async (id,on) => { await api.skillsSetEnabled(id,on); };

// ── 弹窗 ──
function openModal(title, html, onSave){
  $('#mTitle').textContent=title; $('#mBody').innerHTML=html; $('#modal').classList.add('show');
  $('#mSave').onclick = async ()=>{ await onSave(); $('#modal').classList.remove('show'); };
}
$('#mCancel').onclick=()=>$('#modal').classList.remove('show');

// ── 加载 ──
async function loadAll(){
  models = await api.modelsList()||[];
  roles  = await api.rolesList()||[];
  mcps   = await api.mcpList()||[];
  skills = await api.skillsList()||[];
  settings = await api.settingsGet();
  renderModels(); renderRoles(); renderMcp(); renderSkills();

  const mo = ['<option value="">（用默认模型）</option>'].concat(
    models.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`)).join('');
  $('#cDefaultModel').innerHTML = models.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');
  $('#cMainModel').innerHTML = mo;
  $('#cDefaultModel').value = settings.defaultModelId||'';
  $('#cMainModel').value = settings.mainAgentModelId||'';
  $('#cInterval').value = settings.intervalMin||5;
  $('#cRoleStrategy').value = settings.roleStrategy||'llm';
  $('#cFixedRoles').innerHTML = roles.map(r=>
    `<input type="checkbox" id="fr_${r.id}" value="${r.id}"${(settings.fixedRoles||[]).includes(r.id)?' checked':''}><label for="fr_${r.id}">${esc(r.name)}</label>`).join('');
  $('#rowFixedRoles').style.display = settings.roleStrategy==='fixed'?'':'none';
  $('#cAuto').checked = settings.autoStart!==false;
  $('#cDry').checked = settings.dryRun!==false;
  refresh();
}

$('#cRoleStrategy').onchange = e => { $('#rowFixedRoles').style.display = e.target.value==='fixed'?'':'none'; };

$('#btnSave').onclick = async ()=>{
  await api.settingsUpdate({defaultModelId:$('#cDefaultModel').value,
    mainAgentModelId:$('#cMainModel').value||undefined,
    intervalMin:Number($('#cInterval').value)||5,
    roleStrategy:$('#cRoleStrategy').value,
    fixedRoles:[...document.querySelectorAll('[id^=fr_] input:checked')].map(i=>i.value),
    autoStart:$('#cAuto').checked, dryRun:$('#cDry').checked});
  await loadAll(); alert('已保存');
};

$('#btnAddModel').onclick=()=>window.editModel(null);
$('#btnAddRole').onclick=()=>window.editRole(null);
$('#btnAddMcp').onclick=()=>window.editMcp(null);
$('#btnStart').onclick=async()=>{ await api.startAgent(); setTimeout(refresh,600); };
$('#btnStop').onclick=async()=>{ await api.stopAgent(); setTimeout(refresh,400); };
$('#btnOnce').onclick=async()=>{ $('#btnOnce').disabled=true; $('#btnOnce').textContent='运行中…';
  try{ await api.runOnce(); } finally { $('#btnOnce').disabled=false; $('#btnOnce').textContent='跑一轮'; await loadAll(); } };
$('#btnClear').onclick=()=>$('#log').textContent='';
$('#btnOpenStore').onclick=()=>api.openStore();
$('#btnOpenState').onclick=()=>api.openFolder('state');
$('#btnOpenLogs').onclick=()=>api.openFolder('logs');
$('#btnReset').onclick=async()=>{ if(confirm('恢复所有配置为默认？模型/角色/MCP 都会重置。')){ await api.storeReset(); await loadAll(); } };

function appendLog(l){ const el=$('#log'); el.textContent+=l+'\n'; el.scrollTop=el.scrollHeight; }

(async function init(){
  await loadAll();
  (await api.getLogs()||[]).forEach(appendLog);
  api.onLog(appendLog);
  api.onStatus(()=>refresh());
  setInterval(refresh, 8000);
})();
</script>
</body>
</html>
